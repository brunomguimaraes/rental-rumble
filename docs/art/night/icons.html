<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Night · UI icon library</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,monospace;color:#f2f0e6;background:#141a2c}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1440px;margin-inline:auto}header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:28px;margin:0 0 10px}p{color:#9aa6c4;line-height:1.6;margin:0}nav{display:flex;gap:10px;flex-wrap:wrap}button,a{font:inherit;color:inherit}button{padding:10px 14px;border:1px solid #8fa6cc;background:#2a3656;border-radius:3px;cursor:pointer}button[aria-pressed=true]{color:#ffd447;border-color:#ffd447}button:focus-visible,a:focus-visible{outline:2px solid #ffd447;outline-offset:3px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}.icon{margin:0;padding:12px;background:#1e2740;border:1px solid #8fa6cc;border-radius:4px;box-shadow:3px 3px 0 #0a0d18;min-width:0}.surface{height:138px;display:grid;place-items:center;background:#161e34;margin-bottom:12px;border-radius:3px}.surface img{width:96px;height:96px;image-rendering:pixelated;object-fit:contain}.light .surface{background:#f2f0e6}.checker .surface{background-color:#ddd;background-image:linear-gradient(45deg,#aaa 25%,transparent 25%),linear-gradient(-45deg,#aaa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aaa 75%),linear-gradient(-45deg,transparent 75%,#aaa 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}figcaption{font-size:13px;overflow-wrap:anywhere}figcaption a{color:#7fb4ff;text-decoration:none}figcaption small{display:block;color:#9aa6c4;font-size:11px;margin-top:5px}.sizes{display:flex;gap:12px;align-items:center;min-height:72px;margin-top:10px}.sizes img{image-rendering:pixelated;object-fit:contain}.sizes span{display:flex;align-items:center;flex-direction:column;gap:3px;font-size:9px;color:#9aa6c4}footer{margin-top:28px;color:#9aa6c4;font-size:12px;line-height:1.7}@media(max-width:500px){body{padding:18px}main{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sizes{gap:2px}.sizes span:last-child{display:none}}
</style></head><body>
<header><div><h1>Night · UI icon library</h1><p>37 transparent assets · mobile concept collection</p></div><nav aria-label="Preview background"><button data-theme="dark" aria-pressed="true">Night</button><button data-theme="light" aria-pressed="false">Light</button><button data-theme="checker" aria-pressed="false">Transparency</button></nav></header>
<main id="icons" aria-label="Icon catalogue"></main>
<footer>Original concept icons and matching additions. Master PNGs preserve their original alpha channel.<br>Preview sizes: 32, 48, and 64 pixels. <a href="mobile-hub-concept.png">Original concept</a> · <a href="README.md">Usage notes</a></footer>
<script>
const icons=[{"id":"world-map","label":"World map","category":"home"},{"id":"your-box","label":"Your box","category":"home"},{"id":"research","label":"Research","category":"home"},{"id":"all-features","label":"All features","category":"home"},{"id":"routes","label":"Routes","category":"adventure"},{"id":"co-op-trails","label":"Co-op trails","category":"adventure"},{"id":"ranger-rescues","label":"Ranger rescues","category":"adventure"},{"id":"photo-safari","label":"Photo safari","category":"adventure"},{"id":"habitat","label":"Habitat","category":"raise"},{"id":"bond-stories","label":"Bond stories","category":"raise"},{"id":"nursery","label":"Nursery","category":"raise"},{"id":"berry-garden","label":"Berry garden","category":"raise"},{"id":"field-journal","label":"Field journal","category":"discover"},{"id":"fossil-lab","label":"Fossil lab","category":"discover"},{"id":"professions","label":"Professions","category":"discover"},{"id":"crafting","label":"Crafting","category":"discover"},{"id":"battle-dojo","label":"Battle dojo","category":"trainer"},{"id":"league","label":"League","category":"trainer"},{"id":"trading","label":"Trading","category":"trainer"},{"id":"friends","label":"Friends","category":"trainer"},{"id":"bag","label":"Bag","category":"utilities"},{"id":"item-bag","label":"Item Bag","category":"utilities"},{"id":"achievements","label":"Achievements","category":"utilities"},{"id":"guide","label":"Guide","category":"utilities"},{"id":"settings","label":"Settings","category":"utilities"},{"id":"home","label":"Home","category":"navigation"},{"id":"home-active","label":"Home active","category":"navigation"},{"id":"explore","label":"Explore","category":"navigation"},{"id":"party","label":"Party","category":"navigation"},{"id":"pokedex","label":"Pokédex","category":"navigation"},{"id":"pokedex-active","label":"Pokédex active","category":"navigation"},{"id":"menu","label":"Menu","category":"navigation"},{"id":"menu-active","label":"Menu active","category":"navigation"},{"id":"mail","label":"Mail","category":"utilities"},{"id":"coin","label":"Coin","category":"utilities"},{"id":"migration-radar","label":"Migration radar","category":"adventure"},{"id":"moon","label":"Moon","category":"utilities"}];
const base=location.protocol==='file:'?'../../../public/sprites/ui/night/':'/sprites/ui/night/';
for(const icon of icons){const figure=document.createElement('figure');figure.className='icon';const surface=document.createElement('div');surface.className='surface';const img=document.createElement('img');img.src=base+icon.id+'.png';img.alt=icon.label;img.width=96;img.height=96;surface.append(img);const caption=document.createElement('figcaption');const link=document.createElement('a');link.href=img.src;link.textContent=icon.label;const small=document.createElement('small');small.textContent=icon.id+'.png';caption.append(link,small);const sizes=document.createElement('div');sizes.className='sizes';for(const size of [32,48,64]){const sample=document.createElement('span');const mini=img.cloneNode();mini.alt='';mini.width=size;mini.height=size;mini.style.width=size+'px';mini.style.height=size+'px';sample.append(mini,document.createTextNode(size+'px'));sizes.append(sample)}figure.append(surface,caption,sizes);document.getElementById('icons').append(figure)}
for(const button of document.querySelectorAll('button[data-theme]'))button.addEventListener('click',()=>{document.body.className=button.dataset.theme;for(const other of document.querySelectorAll('button[data-theme]'))other.setAttribute('aria-pressed',String(other===button))});
</script></body></html>
